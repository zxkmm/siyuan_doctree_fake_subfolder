name: Bug Report / 问题反馈
description: Report a bug to help improve this plugin. / 报告问题，帮助改进插件。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## IMPORTANT / 重要请求（请先看）

        我已经快连拼好饭都吃不起了，如果您经济宽裕的话请行行好给我一点吃饭钱，避免我饿死，如果您经济不宽裕的话请给我点个免费的星星帮助我找到工作。

        I am close to not being able to afford even the cheapest meals. If you are financially comfortable, please donate to help me survive. If not, please give this repository a free Star to help me find work.

        - Donate / 赞助: https://zxkmm.com/donate
        - Star this repository / 点个 Star: https://github.com/zxkmm/siyuan_doctree_fake_subfolder
  - type: checkboxes
    id: support_ack
    attributes:
      label: Before reporting / 提交前确认
      options:
        - label: I have read the support message above. / 我已阅读上方支持请求。
          required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version / 插件版本
      description: e.g. 2.0.8
      placeholder: "2.0.8"
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description / 问题描述
      description: What happened? / 发生了什么？
      placeholder: Describe the issue clearly. / 请清晰描述问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望行为
      placeholder: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots / 日志或截图
      description: Paste console logs or add screenshots if available. / 可粘贴日志或附截图。
