name: Check if Issue Submitter Has Starred

on:
  issues:
    types: [opened]

jobs:
  check-star:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check star status and comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const user  = context.payload.issue.user.login;
            const issueNumber = context.payload.issue.number;

            // Paginate through stargazers and check if the submitter is in the list
            let hasStarred = false;
            let page = 1;
            outer: while (true) {
              const { data: stargazers } = await github.rest.activity.listStargazersForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              if (stargazers.length === 0) break;
              for (const stargazer of stargazers) {
                const login = stargazer.login;
                if (login === user) {
                  hasStarred = true;
                  break outer;
                }
              }
              if (stargazers.length < 100) break;
              page++;
            }

            let body;
            if (hasStarred) {
              body = `@${user} Thank you for starring ⭐ this repository! Your support means a lot. We'll look into your issue as soon as possible. 🙏`;
            } else {
              body = `@${user} Thanks for opening this issue!\n\n` +
                `It looks like you haven't starred ⭐ this repository yet. If you find this plugin useful, please consider giving it a star — it's free and helps a lot!\n\n` +
                `👉 [Star this repository](https://github.com/${owner}/${repo})\n\n` +
                `We'll still do our best to help you. 😊`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
